name: Stale Dependabot Auto-Close

on:
  schedule:
    - cron: "0 4 * * 1"   # weekly Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be closed without acting"
        type: boolean
        default: false
      stale_days:
        description: "Days of inactivity before a Dependabot PR is considered stale"
        type: number
        default: 14

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: stale-dependabot-close
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      # Schedule runs use the schedule default (14). Dispatch runs use the
      # input value if set, including 0 (must be explicit — `||` would
      # collapse 0 to the default because of JS truthiness in actions).
      STALE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.stale_days != null && inputs.stale_days != '' && format('{0}', inputs.stale_days) || '14' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: List open Dependabot PRs and close the stale ones
        uses: actions/github-script@v9
        with:
          script: |
            const STALE_DAYS = Number(process.env.STALE_DAYS);
            const DRY_RUN = process.env.DRY_RUN === "true";
            const KEEP_LABELS = new Set([
              "keep", "pinned", "do-not-close", "blocked", "in-progress",
              "needs-manual-review",   // flagged by dependabot-auto-merge.yml on Copilot CHANGES_REQUESTED
            ]);
            const isHuman = (u) => u && !u.login.endsWith("[bot]") && u.type !== "Bot";

            // github.paginate() walks every page; per_page:100 alone would silently
            // drop PRs/comments/reviews past the first page. Devin AI review caught this.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", per_page: 100,
            });
            // Exact-match the Dependabot account; a startsWith() match would also
            // catch impersonator apps like dependabot-fork[bot] on a public repo.
            const dependabot = pulls.filter((pr) => pr.user && pr.user.login === "dependabot[bot]");

            const cutoff = Date.now() - STALE_DAYS * 24 * 60 * 60 * 1000;
            const closed = [];
            for (const pr of dependabot) {
              const labels = (pr.labels || []).map((l) => l.name);
              if (labels.some((l) => KEEP_LABELS.has(l))) {
                core.info(`#${pr.number} has keep-label (${labels.join(",")}), skipping`);
                continue;
              }
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, per_page: 100,
              });
              const hasHumanComment = comments.some((c) => isHuman(c.user));
              if (hasHumanComment) {
                core.info(`#${pr.number} has human comments, skipping`);
                continue;
              }
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100,
              });
              // Any human review (APPROVED, CHANGES_REQUESTED, COMMENTED, DISMISSED)
              // counts as feedback. Bots (Copilot, Devin, Codex) don't.
              const hasHumanReview = reviews.some((r) => isHuman(r.user));
              if (hasHumanReview) {
                const state = reviews.find((r) => isHuman(r.user)).state;
                core.info(`#${pr.number} has human review (${state}), skipping`);
                continue;
              }
              const updated = new Date(pr.updated_at).getTime();
              if (updated > cutoff) {
                core.info(`#${pr.number} updated ${pr.updated_at}, within ${STALE_DAYS}d, skipping`);
                continue;
              }
              const dep = (pr.title.match(/bump\s+([^ ]+)/i) || [])[1] || "unknown";
              const body =
                `Closing as stale: no updates for ${STALE_DAYS}+ days and no human feedback.\n\n` +
                `Dependabot will open a fresh PR on its next weekly run if the bump is still relevant.\n\n` +
                `Reopen if you actually need this bump (add the \`keep\` label to prevent auto-close).`;
              if (DRY_RUN) {
                core.info(`[dry-run] would close #${pr.number} (${dep})`);
                closed.push({ n: pr.number, dep, dry: true });
                continue;
              }
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: pr.number, body,
                });
                await github.rest.pulls.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  pull_number: pr.number, state: "closed",
                });
                core.info(`closed #${pr.number}`);
                closed.push({ n: pr.number, dep });
              } catch (err) {
                core.warning(`failed #${pr.number}: ${err.message}`);
              }
            }
            core.summary
              .addHeading("Stale Dependabot Auto-Close", 1)
              .addRaw(`Scanned ${dependabot.length} open dependabot PR(s); closed ${closed.filter((c) => !c.dry).length}.\n\n`)
              .addTable(closed.map((c) => [{ text: `#${c.n}`, header: true }, { text: c.dep, header: true }, { text: c.dry ? "dry-run" : "closed", header: true }]))
              .write();
